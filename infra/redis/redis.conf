# Redis配置文件 - Go后端学习教程
# 适用于开发环境

# 网络配置
bind 0.0.0.0
port 6379
protected-mode no

# 通用配置
daemonize no
databases 16

# 持久化配置 (RDB)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF持久化 (开发环境可以关闭)
appendonly no
appendfilename "appendonly.aof"

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 日志配置
loglevel notice
logfile ""

# 客户端配置
timeout 0
tcp-keepalive 300
maxclients 1000

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 延迟监控
latency-monitor-threshold 100
